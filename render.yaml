# Render Blueprint — deploys the ShikkhaAI backend and RAG service as two
# independent web services. See DEPLOYMENT.md for full instructions.
#
# Apply: Render Dashboard → New → Blueprint → point at this repo.

databases:
  - name: shikkhaai-db
    plan: free
    databaseName: shikkhaai
    user: shikkhaai

services:
  # ── Backend API ─────────────────────────────────────────────────────────────
  - type: web
    name: shikkhaai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: APP_NAME
        value: ShikkhaAI Backend
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # Provided automatically by the managed Postgres above.
      - key: DATABASE_URL
        fromDatabase:
          name: shikkhaai-db
          property: connectionString
      # Set in the dashboard (secret) — do NOT commit a real key.
      - key: GEMINI_API_KEY
        sync: false
      # Public URL of the RAG service below, WITH the /rag router prefix, e.g.
      # https://shikkhaai-rag.onrender.com/rag — set in the dashboard after the
      # RAG service's URL is known (can't be templated with the prefix here).
      - key: RAG_BASE_URL
        sync: false
      - key: RAG_TIMEOUT_SECONDS
        value: "60"
      - key: RAG_INPROCESS
        value: "false"
      - key: MOCK_MODE
        value: "false"
      # Strong random secret generated by Render on first deploy.
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        sync: false

  # ── RAG service ─────────────────────────────────────────────────────────────
  # Uses fastembed/ONNX with a lazy-loaded small embedding model. This keeps
  # model memory below the Render free-tier limit; the model is loaded only on
  # the first retrieval request. chroma_db/ is committed and read at runtime,
  # so no persistent disk is required for retrieval-only use.
  - type: web
    name: shikkhaai-rag
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r rag/requirements.txt
    startCommand: uvicorn rag_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GEMINI_API_KEY
        sync: false
