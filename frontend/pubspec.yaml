name: shikkhaai
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.8.0+1

  # Serialization
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI
  cached_network_image: ^3.4.1
  fl_chart: ^0.70.2
  image_picker: ^1.1.2
  percent_indicator: ^4.2.4
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.7
  file_picker: ^10.1.2

  # Utilities
  intl: ^0.20.2
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.3
  equatable: ^2.0.7
  http_parser: ^4.1.0
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.5
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/textures/
    - assets/images/logos/
    - assets/images/onboarding/
    - assets/images/illustrations/
    - assets/images/subjects/
    - assets/animations/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logos/logo_512.png"
  adaptive_icon_background: "#A0522D"
  adaptive_icon_foreground: "assets/images/logos/logo_512.png"
  min_sdk_android: 21
  remove_alpha_ios: true
