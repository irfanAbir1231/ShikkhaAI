name: Keep Render Services Awake

on:
  schedule:
    # Every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render services
        env:
          RAG_HEALTH_URL: ${{ vars.RAG_HEALTH_URL || secrets.RAG_HEALTH_URL }}
          BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL || secrets.BACKEND_HEALTH_URL }}
        run: |
          set -euo pipefail

          ping_service() {
            local name="$1"
            local url="$2"

            if [ -z "$url" ]; then
              echo "$name URL is not configured; skipping."
              return 0
            fi

            echo "Pinging $name health endpoint"
            # Render free-tier cold starts can take over a minute. Retry the
            # complete request instead of masking a failed health check.
            curl --fail --silent --show-error \
              --retry 3 --retry-all-errors --retry-delay 5 \
              --max-time 120 "$url"
            echo
          }

          ping_service "RAG" "$RAG_HEALTH_URL"
          ping_service "Backend" "$BACKEND_HEALTH_URL"
